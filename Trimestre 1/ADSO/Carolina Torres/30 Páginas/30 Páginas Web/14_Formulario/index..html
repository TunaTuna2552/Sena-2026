<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Evento Académico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Congreso de Innovación 2026</h1>
            <p>Completa tus datos para asegurar tu cupo.</p>
        </header>

        <form id="registrationForm">
            <div class="form-group">
                <label for="fullName">Nombre Completo</label>
                <input type="text" id="fullName" name="fullName" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="juan@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="institution">Institución / Universidad</label>
                <input type="text" id="institution" name="institution" required placeholder="Nombre de tu institución">
            </div>

            <div class="form-group">
                <label for="academicLevel">Nivel Académico</label>
                <select id="academicLevel" name="academicLevel" required>
                    <option value="">Selecciona una opción</option>
                    <option value="estudiante">Estudiante de Grado</option>
                    <option value="posgrado">Estudiante de Posgrado</option>
                    <option value="docente">Docente / Investigador</option>
                    <option value="profesional">Profesional Externo</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">Registrarme ahora</button>
        </form>

        <div id="message" class="hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
