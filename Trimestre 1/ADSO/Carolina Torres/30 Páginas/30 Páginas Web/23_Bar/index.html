<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Neon Bar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="cabecera">
    <div class="logo">NEON BAR</div>
    <div class="subtitulo">EXPERIENCIA NOCTURNA URBANA</div>
</div>

<div class="navegacion">
    <div class="enlaces">
        <a href="#menu">MENÚ</a>
        <a href="#eventos">EVENTOS</a>
        <a href="#galeria">GALERÍA</a>
    </div>
</div>

<div class="contenedor">
    <div id="menu" class="seccion">
        <div class="titulo-seccion">CÓCTELES Y SNACKS</div>
        <div class="cuadricula">
            <div class="tarjeta">
                <div class="caja-foto"><img src="https://gourmet.iprospect.cl/wp-content/uploads/2019/11/electric-lemonade-e1573487020571.jpg"></div>
                <div class="nombre">Mojito Eléctrico</div>
                <div class="precio">$28.000</div>
            </div>
            <div class="tarjeta">
                <div class="caja-foto"><img src="Gemini_Generated_Image_xatm9gxatm9gxatm.png"></div>
                <div class="nombre">Gin Tonic Premium</div>
                <div class="precio">$35.000</div>
            </div>
        </div>
    </div>

    <div id="eventos" class="seccion">
        <div class="titulo-seccion">PRÓXIMAS NOCHES</div>
        <div class="cuadricula">
            <div class="tarjeta-evento">
                <div class="nombre">Techno Night</div>
                <div class="detalle">Viernes - DJ Invitado</div>
                <div class="boton" onclick="reservar()">RESERVAR</div>
            </div>
            <div class="tarjeta-evento">
                <div class="nombre">Urban Fest</div>
                <div class="detalle">Sábado - Barra Libre</div>
                <div class="boton" onclick="reservar()">RESERVAR</div>
            </div>
        </div>
    </div>

    <div id="galeria" class="seccion">
        <div class="titulo-seccion">GALERÍA</div>
        <div class="cuadricula-fotos">
            <div class="foto"><img src="https://www.swandorhotels.com/images/restaurant/80a93e1efb7ea71b8345.webp"></div>
            <div class="foto"><img src="https://thumbs.dreamstime.com/b/barra-del-disco-45026691.jpg"></div>
            <div class="foto"><img src="https://upload.wikimedia.org/wikipedia/commons/3/32/Wikipedia_space_ibiza%2803%29.jpg"></div>
        </div>
    </div>
</div>

<div class="pie">
    <div class="texto-pie">&copy; 2026 Neon Bar - ADSO :D</div>
</div>

<script src="script.js"></script>
</body>
</html>
