<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Academia de Música</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="titulo-principal">ACADEMIA DE MÚSICA</div>
    </header>

    <main>
        <div id="instrumentos">
            <h2>NUESTROS INSTRUMENTOS</h2>
            <div class="contenedor-flex">
                <div class="tarjeta">
                    <h3>Guitarra</h3>
                    <p>Acústica y Eléctrica</p>
                </div>
                <div class="tarjeta">
                    <h3>Piano</h3>
                    <p>Clásico y Jazz</p>
                </div>
                <div class="tarjeta">
                    <h3>Batería</h3>
                    <p>Percusión Avanzada</p>
                </div>
            </div>
        </div>

        <div id="profesores">
            <h2>NUESTROS PROFESORES</h2>
            <div class="contenedor-flex">
                <div class="perfil">
                    <img src="https://www.atptour.com/-/media/alias/player-headshot/v836">
                    <p class="nombre">Juan Violín</p>
                </div>
                <div class="perfil">
                    <img src="https://booker.ar/wp-content/uploads/2024/02/contratar-a-maria-becerra-contrataciones.webp">
                    <p class="nombre">Maria Piano</p>
                </div>
                <div class="perfil">
                    <img src="https://img.a.transfermarkt.technology/portrait/big/330031-1648027612.png?lm=1">
                    <p class="nombre">Ricardo Rock</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="info">
            <p>Dirección: Calle 10 #5-20, Mosquera - CBA</p>
            <p>Teléfono: 310 555 1234</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
